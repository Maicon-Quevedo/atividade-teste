    <main>

                    <button class="button">

                </div>

                                <path fill="#d50000" d="M16 10A14 14 0 1 0 16 38A14 14 0 1 0 16 10Z"></path>

                            </svg>
                            </div>
                            <div class="number-container">
                            <label class="input-label">CARD NUMBER</label>
                            <input class="inputstyle" placeholder="XXXX XXXX XXXX XXXX" type="text" readonly />
                            </div>
                            <div class="name-date-cvv-container">
                                <div class="name-wrapper">
                                    <label class="input-label">CARD HOLDER</label>
                                    <input class="inputstyle" placeholder="NAME" type="text" readonly />
                                </div>
                                <div class="expiry-wrapper">
                                    <label class="input-label">VALID THRU</label>
                                    <input class="inputstyle" placeholder="MM/YY" type="text" readonly />
                                </div>
                                <div class="cvv-wrapper">
                                    <label class="input-label">CVV</label>
                                    <input class="inputstyle" placeholder="***" maxlength="3" type="password" readonly />
                                </div>
                            </div>
                        </div>

                        <div class="visa-card">
                            <div class="logoContainer">
                            <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="23" height="23" viewBox="0 0 48 48" class="svgLogo">
                                <path fill="#ff9800" d="M32 10A14 14 0 1 0 32 38A14 14 0 1 0 32 10Z"></path>
                                <path fill="#d50000" d="M16 10A14 14 0 1 0 16 38A14 14 0 1 0 16 10Z"></path>
                                <path fill="#ff3d00" d="M18,24c0,4.755,2.376,8.95,6,11.48c3.624-2.53,6-6.725,6-11.48s-2.376-8.95-6-11.48 C20.376,15.05,18,19.245,18,24z"></path>

                            </div>
                            <div class="number-container">
                            <label class="input-label">CARD NUMBER</label>
                            <input class="inputstyle" placeholder="XXXX XXXX XXXX XXXX" type="text" readonly />
                            </div>
                                <div class="name-date-cvv-container">

                                    <label class="input-label">CARD HOLDER</label>
                                    <input class="inputstyle" placeholder="NAME" type="text" readonly />
                                </div>
                                <div class="expiry-wrapper">
                                    <label class="input-label">VALID THRU</label>
                                    <input class="inputstyle" placeholder="MM/YY" type="text" readonly />
                                </div>
                                <div class="cvv-wrapper">
                                    <label class="input-label">CVV</label>
                                    <input class="inputstyle" placeholder="***" maxlength="3" type="password" readonly />
                                </div>
                            </div>

                                <path fill="#ff9800" d="M32 10A14 14 0 1 0 32 38A14 14 0 1 0 32 10Z"></path>
                                <path fill="#d50000" d="M16 10A14 14 0 1 0 16 38A14 14 0 1 0 16 10Z"></path>

                            </svg>
                            </div>
                            <div class="number-container">
                            <label class="input-label">CARD NUMBER</label>
                            <input class="inputstyle" placeholder="XXXX XXXX XXXX XXXX" type="text" readonly />
                            </div>
                            <div class="name-date-cvv-container">
                                <div class="name-wrapper">
                                    <label class="input-label">CARD HOLDER</label>
                                    <input class="inputstyle" placeholder="NAME" type="text" readonly />
                                </div>
                                <div class="expiry-wrapper">

                    </div>
                    
                    <div class="coluna-direita">
                        <div class="balance-card">
                            <div class="balance-header">
                                <span class="balance-title">Total balance</span>
                                <span class="badge badge-income">↗ $ 6,220.13</span>
                                <span class="badge badge-expense">↓ $ 919.60</span>
                            </div>
                            <div class="balance-value">$ 7,610.00</div>
                            <div class="balance-actions">
                                <button class="btn-deposit">Deposit</button>
                                <button class="btn-withdraw">Withdraw</button>
                            </div>
                        </div>
                            <div class="chart-card">
                                <div class="chart-header">
                                    <span class="chart-legend">
                                        <span class="dot dot-income"></span> Income
                                        <span class="dot dot-withdrawals"></span> Withdrawals
                                    </span>
                                </div>

                                <div class="chart-tooltip">+ $ 88.99</div>

                                <svg viewBox="0 0 500 150" class="chart-svg" preserveAspectRatio="none">
                                    <polyline
                                        class="line-income"
                                        points="0,100 70,80 140,60 210,90 280,40 350,70 420,50 500,90"
                                    />
                                    <polyline
                                        class="line-withdrawals"
                                        points="0,60 70,110 140,90 210,50 280,100 350,40 420,90 500,60"
                                    />
                                </svg>

                                <div class="chart-days">
                                    <span>Mon</span>
                                    <span>Tue</span>
                                    <span>Wed</span>
                                    <span>Thu</span>
                                    <span>Fri</span>
                                    <span>Sat</span>
